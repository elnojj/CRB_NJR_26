# Canonical production publish: Firebase Hosting (AI Studio project).
# Deploy needs repo secret FIREBASE_TOKEN (firebase login:ci).
# Quality gates always run; missing token skips deploy without failing the merge.
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: npm ci
      - name: Validate design lock
        run: npm run validate:design
      - name: Lint
        run: npm run lint
      - name: Typecheck intro
        run: npm run typecheck:intro
      - name: QA spheres
        run: npm run qa:spheres
      - name: QA remediation contract
        run: npm run qa:remediation
      - name: QA intro
        run: npm run qa:intro
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: dist
          retention-days: 3

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist
      - name: Deploy Hosting
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx firebase-tools@latest deploy --only hosting --project advance-copilot-489023-c3 --non-interactive
      - name: Skip deploy (no FIREBASE_TOKEN)
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::warning::FIREBASE_TOKEN secret is not set — quality gates passed; deploy skipped."
          echo "Create a token with: npx firebase-tools login:ci"
          echo "Then add it as the FIREBASE_TOKEN repository secret on elnojj/CRB_NJR_26."
