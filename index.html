    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteHmrSocket(url, protocols) {
          var target = new EventTarget();
          this.url = url;
          this.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
          this.readyState = 0;
          this.CONNECTING = 0;
          this.OPEN = 1;
          this.CLOSING = 2;
          this.CLOSED = 3;
          this.bufferedAmount = 0;
          this.extensions = '';
          this.binaryType = 'blob';
          this.onopen = null;
          this.onmessage = null;
          this.onerror = null;
          this.onclose = null;
          this.addEventListener = target.addEventListener.bind(target);
          this.removeEventListener = target.removeEventListener.bind(target);
          this.dispatchEvent = target.dispatchEvent.bind(target);
          this.send = function () {};
          this.close = function () {
            this.readyState = 3;
          };
          var self = this;
          setTimeout(function () {
            self.readyState = 1;
            var evt = new Event('open');
            self.dispatchEvent(evt);
            if (typeof self.onopen === 'function') self.onopen(evt);
          }, 10);
        }
        MockViteHmrSocket.CONNECTING = 0;
        MockViteHmrSocket.OPEN = 1;
        MockViteHmrSocket.CLOSING = 2;
        MockViteHmrSocket.CLOSED = 3;

        var PatchedWebSocket = function (url, protocols) {
          var isViteHmr =
            protocols === 'vite-hmr' ||
            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
          if (isViteHmr) {
            return new MockViteHmrSocket(url, protocols);
          }
          return arguments.length > 1 && protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        };
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
